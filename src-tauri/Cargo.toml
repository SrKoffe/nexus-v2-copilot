[package]
name = "nexus-v2-copilot"
version = "0.1.0"
description = "Nexus V2 — MEXC trading co-pilot (decision support, manual execution)"
authors = ["Roberto <betokuffel@gmail.com>"]
edition = "2021"

[lib]
name = "nexus_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket client (MEXC futures stream)
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
url = "2"

# HTTP client (MEXC futures REST API)
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# SQLite database
rusqlite = { version = "0.31", features = ["bundled"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Crypto — HMAC SHA256 for MEXC private API request signing
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# .env loader for API keys (kept out of git)
dotenvy = "0.15"

# Legacy from antigravity-v2 (Hyperliquid signing). Unused now but kept until
# the old Hyperliquid execution path is fully removed in a future cleanup.
ethers-core = "2"
ethers-signers = "2"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Platform directories
dirs-next = "2"
tauri-plugin-fs = "2.2.0"
